<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App - Integrasi RESTful API & Webpack</title>

    <!-- Google Fonts: Plus Jakarta Sans & Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Indikator Loading Global (Kriteria Wajib 5) -->
    <loading-indicator></loading-indicator>

    <!-- App Frame Canvas (Syncscribe Floating Canvas Design) -->
    <div class="app-frame">
      <!-- Sidebar Navigasi (Kriteria Wajib 1, 4 & Custom Attributes) -->
      <app-bar
        title="Syncscribe"
        user="Personal Notes"
        caption="RESTful API v2"
      ></app-bar>

      <!-- Dashboard Konten Utama -->
      <main class="dashboard-main">
        <!-- Formulir Tambah Catatan (Kriteria Wajib 1, 2 & Realtime Validation) -->
        <note-input></note-input>

        <!-- Daftar Catatan Berbasis CSS Grid & Recent Folders (Kriteria Wajib 1, 2, 3, 4) -->
        <note-list></note-list>
      </main>
    </div>

    <!-- Footer Aplikasi -->
    <footer-bar></footer-bar>
  </body>
</html>
